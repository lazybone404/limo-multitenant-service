# ============================================================
# python-core 配置 —— 引擎 / LLM 厂商由服务端配置决定，不进入接口返回。
# （/capabilities 只返回能力名；用户看不到厂商/引擎）
# 填自己的 key/地址即可，或用环境变量注入（最安全）。
# ============================================================

llm:
  provider: "openai"     # 选哪个厂商：openai / mock / 自定义（加 providers 里即可）
  base_url: ""          # OpenAI 兼容地址，如 https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ""           # 你的 LLM key（可用环境变量 LLM_API_KEY 覆盖）
  model: "qwen-plus"    # 模型名
  providers:            # 多厂商配置（可加多个，改 provider 切换）
    openai:
      base_url: ""
      model: "qwen-plus"
    # custom:
    #   base_url: "https://..."    # 自定义/你们自己的服务
    #   model: "..."
    #   api_key: "..."

asr:
  provider: ""          # 语音转写服务：dashscope / bcut（视频转笔记才需要）
  api_key: ""           # ASR key（文档不需要）

engines:
  document: "local"     # 文档提取引擎：local（可换/自定义，在 engines/ 注册）

# 生成提示词风格/选项
generation:
  style: "detailed"     # 笔记默认风格：detailed/concise/academic/tutorial（视频可 meeting，文档可 outline）
  options:
    toc: false           # 是否生成目录
    summary: true        # 是否生成总结

# 可选：代理（下载视频/调外部服务用）
proxy: ""
