# ===== limo Java 业务端配置 =====
spring.application.name=limo-service

# 数据库：下面三个默认值只保证本地开发能起来。
# 生产必须用环境变量注入 DB_URL / DB_USER / DB_PASSWORD，不要用这里的默认密码。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/limo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:88888888}

# 建表策略与 SQL 日志：默认值面向本地开发。
# 生产用 DDL_AUTO=validate（不让应用改表结构）、SHOW_SQL=false。
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=8082

# JWT：secret 必须由环境变量注入。这里的默认值只是为了本地能起来，不允许上生产——
# 一旦泄露，任何人都能自己签发一张合法的登录凭证。
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789}
jwt.expire-hours=${JWT_EXPIRE_HOURS:72}

# python-core 地址（供 Java 调用）
limo.python-core.base-url=${PYTHON_CORE_URL:http://localhost:8001}
