server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # proxy api to the java backend container (service name = backend)
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ {
        proxy_pass http://backend:8082/static/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
